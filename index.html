<!-- JAVASCRIPT -->
<script>
let menarajam = document.querySelector('.menarajamdiv');
let kaset = document.querySelector('.kasetdiv');
let thanks = document.querySelector('.thanks');
let kupukupu = document.querySelector('.kupukupudiv');
let Lovutama = document.querySelector('.Lovutama');
let klipfilm = document.querySelector('.klipfilmdiv');
let ourmemories = document.querySelector('.OurMemories');
let memories1 = document.getElementById('Memories1');
let fotokelas11_1 = document.querySelector('.kelas11_1_div');
let fotokelas11_2 = document.querySelector('.kelas11_2_div');
let fotokelas11_3 = document.querySelector('.kelas11_3_div');

let currentScroll = 0;
let targetScroll = 0;
let memoriesY = -200; // posisi awal turun 200px
let Leftrotasi = 0;
let Rightrotasi = 0;
let Centerrotasi = 10;
let kelasScale = 1;

window.addEventListener('scroll', () => {
    targetScroll = window.scrollY;
});

function smoothParallax() {

    currentScroll += (targetScroll - currentScroll) * 0.04;

    // ===============================
    // ANIMASI ANIMASI HALAMAN UTAMA
    // ===============================
    Lovutama.style.transform = `translateY(${currentScroll * 0.2}px)`;
    menarajam.style.transform = `translateY(${currentScroll * 0.5}px)`;

    let scaleValue = 1 - currentScroll * 0.001;
    if (scaleValue < 0.3) scaleValue = 0.3;

    kaset.style.transform = `scale(${scaleValue})`;
    kupukupu.style.transform = `scale(${scaleValue})`;
    
    thanks.style.transform = `translateY(${-currentScroll * 0.2}px)`;
    klipfilm.style.transform = `translateX(${currentScroll * 0.4}px)`;


    // ===============================
    // SMOOTHING MEMORIES 1
    // ===============================
    if (memories1) {

        let rect = memories1.getBoundingClientRect();
        let windowHeight = window.innerHeight;

        let progress = 1 - (rect.top / windowHeight);
        progress = Math.max(0, Math.min(progress, 1));

        let targetY = (1 - progress) * -200;

        // smooth interpolation
        memoriesY += (targetY - memoriesY) * 0.08;

        ourmemories.style.transform = `translateY(${memoriesY}px)`;

    }
    // ===============================
    // ANIMASI KELAS11_1_DIV
    // ===============================
    if (fotokelas11_1) {

        let rect = memories1.getBoundingClientRect();
        let windowHeight = window.innerHeight;

        let progress = 1 - (rect.top / windowHeight);
        progress = Math.max(0, Math.min(progress, 1));

        let targetRotation = progress * 10; // dari 0 ke 10deg

        // smooth interpolation
        Rightrotasi += (targetRotation - Rightrotasi) * 0.08;

        fotokelas11_1.style.transform = `rotate(${Rightrotasi}deg)`;
    }
    // ===============================
    // ANIMASI KELAS11_2_DIV
    // ===============================
    if (fotokelas11_2) {
        
        let rect = memories1.getBoundingClientRect();
        let windowHeight = window.innerHeight;
        
        let progress = 1 - (rect.top / windowHeight);
        progress = Math.max(0, Math.min(progress, 1));
        
        let targetRotation = progress * -8; // dari 0 ke 10deg
        
        // smooth interpolation
        Leftrotasi += (targetRotation - Leftrotasi) * 0.06;
        
        fotokelas11_2.style.transform = `rotate(${Leftrotasi}deg)`;
    }
    // ===============================
    // ANIMASI KELAS11_3_DIV
    // ===============================
    if (fotokelas11_3) {

        let rect = memories1.getBoundingClientRect();
        let windowHeight = window.innerHeight;

        let progress = 1 - (rect.top / windowHeight);
        progress = Math.max(0, Math.min(progress, 1));

        let targetRotation = -10 + (progress * 10); // 10 → 0

        // smooth interpolation
        Centerrotasi += (targetRotation - Centerrotasi) * 0.08;

        fotokelas11_3.style.transform = `rotate(${Centerrotasi}deg)`;
    }
    
    
    
    requestAnimationFrame(smoothParallax);
}

smoothParallax();

// Reload
window.history.scrollRestoration = "manual";

window.addEventListener("load", () => {
    window.scrollTo(0, 0);
});
</script>
    
</body>
</html>
